<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de El Principito</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 0;
    }

    .contenedor {
      width: 90%;
      max-width: 700px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
    }

    .subtitulo {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    #chat {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      min-height: 400px;
      max-height: 500px;
      overflow-y: auto;
    }

    .mensaje {
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: #334155;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #facc15;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>🌟 El Principito</h1>

    <p class="subtitulo">
      Pregunta cualquier cosa sobre el libro
    </p>

    <div id="chat">

      <div class="mensaje bot">
        Hola, soy tu asistente de El Principito. ¿En qué puedo ayudarte?
      </div>

    </div>

    <div class="entrada">

      <input
        id="pregunta"
        type="text"
        placeholder="Escribe tu pregunta..."
      >

      <button onclick="enviarPregunta()">
        Enviar
      </button>

    </div>

  </div>


  <script>

    const WEBHOOK_URL = "PEGA_AQUI_TU_WEBHOOK";


    async function enviarPregunta() {

      const input = document.getElementById("pregunta");
      const chat = document.getElementById("chat");

      const pregunta = input.value.trim();

      if (!pregunta) {
        return;
      }


      // Mostrar pregunta del usuario
      chat.innerHTML += `
        <div class="mensaje usuario">
          ${pregunta}
        </div>
      `;


      input.value = "";


      // Mensaje temporal
      const esperando = document.createElement("div");

      esperando.className = "mensaje bot";

      esperando.innerText = "Pensando...";

      chat.appendChild(esperando);


      try {

        const respuesta = await fetch(WEBHOOK_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            pregunta: pregunta
          })

        });


        const data = await respuesta.json();


        esperando.innerText =
          data.respuesta || "No recibí una respuesta.";

      }

      catch (error) {

        esperando.innerText =
          "Error al conectar con el asistente.";

        console.error(error);

      }


      chat.scrollTop = chat.scrollHeight;

    }


    document
      .getElementById("pregunta")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          enviarPregunta();
        }

      });

  </script>

</body>
</html>
